<script>
'use strict';
/* ==========================================================================
   MOON CITY - stage 1
   Sections: CONFIG, i18n, DEFS (data table), state, simulation (pure logic),
   rendering, input, UI, save/load, hooks.
   ========================================================================== */

/* ===================== CONFIG (all tunable numbers live here) ===================== */
const CONFIG = {
  gridSize: 64,            // map is gridSize x gridSize tiles
  tileW: 64, tileH: 32,    // isometric tile size in world pixels
  startMoney: 15000,
  cycleSeconds: 360,       // real seconds (at 1x) for one lunar cycle = 29.5 Earth days. Settings slider changes this.
  daysPerCycle: 29.5,      // Earth days per lunar cycle (about half is sunlit, half is night)
  dayFraction: 0.5,        // fraction of the cycle that is sunlit (~14.75 days)
  startPhase: 0.04,        // game starts shortly after lunar dawn
  twilight: 0.012,         // fraction of a cycle for dawn/dusk ramp
  monthsPerCycle: 12,      // "months" (income ticks) per lunar cycle
  gameOverMoney: -5000, gameOverMonths: 3,
  autosaveSeconds: 30,
  difficulty: 1,           // 0.5 easy .. 1.5 hard: scales maintenance up and tax income down
  simStep: 0.5,            // simulation step in game seconds
  // growth
  spawnRate: 0.15,         // chance per second per empty, connected zone tile at demand 1
  upgradeRate: 0.02,
  downgradeRate: 0.04,
  popGrowth: 0.03,         // fraction of the gap to target housing filled per second
  popLeave: 0.08,          // fraction leaving per second when life support fails
  workforce: 0.55,         // share of residents that work
  // life support units per resident / job
  waterPerResident: 0.05, oxygenPerResident: 0.05, waterPerJob: 0.012, oxygenPerJob: 0.012,
  // transit
  tripsPerResident: 0.25, tripsPerJob: 0.15,
  tubeCapacity: { street: 4, main: 14, station: 74 },
  tubeMaintenance: { street: 0.6, main: 1.5, station: 8 },
  tubeCost: { street: 15, main: 45, station: 600 },
  congestionStart: 0.7, congestionRange: 0.6, congestionIncomePenalty: 0.4,
  // shielding
  shield: { surface: 0.2, built: 0.8, other: 0.4, regolith: 0.8, regolithCostPerTile: 80, good: 0.75, happinessWeight: 25 },
  nuclearBuffer: 4,        // no residential within this many tiles of a reactor
  parkRadius: 7,           // dome park happiness radius (tiles)
  parkHappiness: 14, parkOxygenBonus: 12,
  // economy (credits per month)
  taxBase: { R: 0.25, C: 0.5, I: 0.5, T: 0.5 },
  defaultTax: 9,
  exportPerIndJob: 5, touristIncome: 5, spaceportIncome: 200,
  zoneUpkeep: 0.5,         // per built zone tile per level per month
  // happiness

function newGame() {
  if (typeof probSeen !== 'undefined' && probSeen) probSeen.clear();
  S = {
    v: 1, time: CONFIG.startPhase * CONFIG.cycleSeconds, cycle: 1,

    last: { income: 0, expense: 0, net: 0 },
    stats: {}, demand: { R: 0, C: 0, I: 0 }, alerts: {}
  };
  for (let i = 0; i < N * N; i++) S.cells.push(mkCell());
  S.seed = 1 + (Math.random() * 9000 | 0);
  genTerrain();
  const ox = (N - 32) >> 1;
  addBuilding('hub', 14 + ox, 14, true);
  for (let y = 6; y <= 13; y++) { const c = cell(15 + ox, y); c.tube = 2; }
  addBuilding('ice', 15 + ox, 4, true);
  addBuilding('solar', 10 + ox, 12, true); addBuilding('solar', 10 + ox, 15, true); addBuilding('solar', 10 + ox, 18, true);
  S.dirty = true;

function genTerrain() {
  const ox = (N - 32) >> 1;
  // polar shadowed crater with ice at the top of the map
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const dx = (x + 0.5 - 15.5 - ox) / 8, dy = (y + 0.5 - 3.6) / 3.8, d = dx * dx + dy * dy;
    const c = cell(x, y);
    if (d < 1) c.terr = 2; else if (d < 1.5) c.terr = 3;
  }
  const rng0 = mulberry(31 + (Math.random() * 1e6 | 0));
  // extra ice deposits to mine, away from the hub and from each other
  const iceAt = [[15.5 + ox, 3.6]];
  for (let k = 0, tries = 0; k < Math.round(4 * N * N / 1024) + 2 && tries++ < 400;) {
    const cx = 4 + rng0() * (N - 8), cy = 8 + rng0() * (N - 12), rx = 3.0 + rng0() * 1.6, ry = 2.3 + rng0() * 1.2;
    if (Math.hypot(cx - 15.5 - ox, cy - 15.5) < 9) continue;
    if (iceAt.some(p => Math.hypot(p[0] - cx, p[1] - cy) < 9)) continue;
    iceAt.push([cx, cy]);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry, d = dx * dx + dy * dy, c = cell(x, y); if (d < 1) c.terr = 2; else if (d < 1.5 && c.terr === 0) c.terr = 3; }
    k++;
  }
  // mountains (not buildable)
  for (let k = 0, tries = 0; k < Math.round(4 * N * N / 1024) && tries++ < 400;) {
    const cx = 2 + rng0() * (N - 4), cy = 8 + rng0() * (N - 10), r = 1.0 + rng0() * 1.3;
    if (Math.hypot(cx - 15.5 - ox, cy - 15.5) < 8 + r) continue;
    let ok = true; for (let y = 0; y < N && ok; y++) for (let x = 0; x < N; x++) { if (Math.hypot(x + 0.5 - cx, y + 0.5 - cy) < r + 1 && cell(x, y).terr === 2) { ok = false; break; } }
    if (!ok) continue;
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { const c = cell(x, y); if (Math.hypot(x + 0.5 - cx, y + 0.5 - cy) < r && (c.terr === 0 || c.terr === 3)) c.terr = 7; }
    k++;
