ional: tap a HOME (residential) to pile moon dust on it. More radiation shielding means happier, faster-growing residents.": "אופציונלי: הקישו על בית (מגורים) כדי לערום עליו אבק ירח. מיגון קרינה גבוה יותר אומר תושבים שמחים יותר שצומחים מהר יותר.", "Drag to paint a residential zone. Needs a tube nearby. Homes come with moon-dust radiation shielding built in.": "גררו כדי לצבוע אזור מגורים. צריך צינור בקרבת מקום. הבתים מגיעים עם מיגון קרינה מאבק ירח מובנה.", "Underground view. Drag over the cave tiles (a slightly different colour) to build homes inside the rock: free full radiation shielding and twice the residents of a normal home. 30 cr per tile. A linked Metro Station must be within 3 tiles; no surface tube needed.": "תצוגה תת-קרקעית. גררו על משבצות המערה (בצבע מעט שונה) כדי לבנות בתים בתוך הסלע: מיגון קרינה מלא חינם וכפול תושבים מבית רגיל. 30 קר למשבצת. תחנת מטרו מקושרת חייבת להיות במרחק 3 משבצות; לא צריך צינור על-קרקעי.", "Drag to paint a commercial zone.": "גררו כדי לצבוע אזור מסחר.", "Drag to paint an industrial zone.": "גררו כדי לצבוע אזור תעשייה.", "Drag to paint a tourism zone. Pays very well. Needs a tube, power and happiness 50+. A Spaceport raises tourist income by 1.7x.": "גררו כדי לצבוע אזור תיירות. משלם מצוין. צריך צינור, חשמל ושמחה 50+. נמל חלל מעלה את הכנסת התיירות פי 1.7.", "Drag to clear empty zones.": "גררו כדי לנקות אזורים ריקים.", "Drag to draw fast Main Tubes. Link buildings to the Landing Hub.": "גררו כדי לצייר צינורות ראשיים מהירים. קשרו בניינים למרכז הנחיתה.", "Drag to draw cheap Street Tubes inside districts.": "גררו כדי לצייר צינורות רחוב זולים בתוך שכונות.", "Underground view. Drag to lay metro track (40 cr per tile, 0.3 upkeep). Link Metro Stations with track to cut congestion.": "תצוגה תת-קרקעית. גררו כדי להניח מסילת מטרו (40 קר למשבצת, 0.3 תחזוקה). קשרו תחנות מטרו במסילה כדי להפחית עומס.", "Works in the surface or underground view. Tap free land or a surface Station tile (2,500 cr, 15 upkeep). Link it by metro track to a station that touches the tubes and it lets neighbouring zones grow.": "עובד בתצוגה העל-קרקעית או התת-קרקעית. הקישו על קרקע פנויה או על משבצת תחנת צינור (2,500 קר, 15 תחזוקה). קשרו במסילה לתחנה הנוגעת בצינורות והיא מאפשרת לאזורים שכנים לגדול.", "Underground view. Tap or drag to remove only metro track or stations. The surface above is never touched.": "תצוגה תת-קרקעית. הקישו או גררו כדי להסיר רק מסילות או תחנות מטרו. השטח שמעל לא נפגע לעולם.", "Drag over craters (55 cr per tile) or mountains (130 cr per tile) to flatten them so you can build there.": "גררו על מכתשים (55 קר למשבצת) או הרים (130 קר למשבצת) כדי ליישר אותם לבנייה.", "Delete this colony and start a new one.": "מחיקת המושבה והתחלה מחדש.", "Tap an existing tube tile to add a station (+capacity).": "הקישו על משבצת צינור קיימת כדי להוסיף תחנה (+קיבולת).", "tap the map to place. Drag to pan.": "הקישו על המפה כדי להציב. גררו כדי לגלול.", "Tip 1 of 5: open the <b>Power</b> tab and build a <b>Solar Array</b> near the Landing Hub.": "טיפ 1 מתוך 5: פתחו את לשונית <b>חשמל</b> ובנו <b>מערך סולארי</b> ליד מרכז הנחיתה.", "Tip 2 of 5: open <b>Tubes</b>, pick <b>Main Tube</b> and drag from the hub to link buildings. Everything must connect to the hub.": "טיפ 2 מתוך 5: פתחו <b>צינורות</b>, בחרו <b>צינור ראשי</b> וגררו מהמרכז כדי לקשר בניינים. הכל חייב להתחבר למרכז.", "Tip 3 of 5: in <b>Life</b>, build an <b>Ice Mining Outpost</b> on the blue ice, then a <b>Water Processing Plant</b>. Link both with tubes.": "טיפ 3 מתוך 5: ב<b>חיים</b>, בנו <b>מוצב כריית קרח</b> על הקרח הכחול, ואז <b>מפעל טיהור מים</b>. קשרו את שניהם בצינורות.", "Tip 4 of 5: in <b>Zones</b>, paint <b>Residential</b> next to a tube. People move in when power and water work.": "טיפ 4 מתוך 5: ב<b>אזורים</b>, צבעו <b>מגורים</b> ליד צינור. אנשים נכנסים כשהחשמל והמים עובדים.", "Tip 5 of 5: tap the red <b>! </b> button any time to see what is missing, and the smiley button for advisors. Night lasts about 14 days: build batteries.": "טיפ 5 מתוך 5: הקישו על כפתור <b>! </b>האדום ב function promSides(b) { // which sides of this square piece touch another promenade piece (true edge neighbours only)
  const d = DEFS[b.def], s = { l: 0, r: 0, t: 0, bo: 0 };
  const isP = (xx, yy) => { if (!inb(xx, yy)) return false; const c = cell(xx, yy); if (!c.b) return false; const bb = S.bmap[c.b]; return bb && DEFS[bb.def].kind === 'promenade'; };

  for (let i = 0; i < d.w; i++) { s.t = s.t || isP(b.x + i, b.y - 1); s.bo = s.bo || isP(b.x + i, b.y + d.h); }

  TR2('sputnik', 'Sputnik 1 Monument', '#cfd3dc', 36, 40, 1000, 'real: first artificial satellite, 1957', 'Sputnik 1 was the first artificial Earth satellite, launched by the Soviet Union on 4 October 1957. It was a polished metal sphere 58 cm across with four antennas, and its radio pulses could be heard by amateur radio operators.', 'ספוטניק 1 היה הלוויין המלאכותי הראשון של כדור הארץ, ששוגר בידי ברית המועצות ב-4 באוקטובר 1957. זו הייתה כדור מתכת מלוטש ברוחב 58 ס"מ עם ארבע אנטנות, ואת פולסי הרדיו שלו יכלו לשמוע חובבי רדיו.');

  TR2('leonov', 'Alexei Leonov Monument', '#f2f4fa', 42, 45, 1400, 'real: first spacewalk, 1965', 'Alexei Leonov (1934-2019) made the first spacewalk on 18 March 1965, during Voskhod 2. He was outside the spacecraft for 12 minutes and 9 seconds.', 'אלכסיי לאונוב (1934-2019) ביצע את הליכת החלל הראשונה ב-18 במרץ 1965, במשימת ווסחוד 2. הוא שהה מחוץ לחללית 12 דקות ו-9 שניות.');
  TR2('lunokhod', 'Lunokhod 1 Monument', '#c4c9d4', 30, 50, 1600, 'real: first rover on the Moon, 1970', 'Lunokhod 1 was the first robotic rover on the Moon. The Soviet Union landed it in Mare Imbrium (the Sea of Rains) on 17 November 1970. It was built for three lunar days, worked for eleven (321 Earth days) and drove 10.54 km.', 'לונוחוד 1 היה הרכב הרובוטי הראשון על הירח. ברית המועצות הנחיתה אותו בים הגשמים (Mare Imbrium) ב-17 בנובמבר 1970. הוא תוכנן לשלושה ימי ירח, פעל אחד עשר (321 ימי כדור הארץ) ונסע 10.54 ק"מ.');

  TR2('saturnv', 'Saturn V Monument', '#f4f4f6', 90, 70, 2400, 'real: rocket of the Apollo Moon missions', 'The Saturn V was the rocket that sent the Apollo astronauts to the Moon. It stood 111 m tall, had three stages, and flew 13 times between 1967 and 1973, all from Kennedy Space Center.', 'סטורן 5 הייתה הרקטה ששלחה את אסטרונאוטי אפולו לירח. גובהה 111 מטר, היו לה שלושה שלבים, והיא שוגרה 13 פעמים בין 1967 ל-1973, כולן ממרכז החלל קנדי.');
  TR2('goldrecord', 'Golden Record Monument', '#e9bd45', 40, 55, 3000, 'real: Voyager Golden Record, 1977', 'The Voyager Golden Records are two identical phonograph records, one on each of the two Voyager spacecraft launched in 1977. They carry sounds and pictures that show life and culture on Earth, chosen by a committee led by Carl Sagan.', 'התקליטים המוזהבים של וויאג\'ר הם שני תקליטים זהים, אחד בכל אחת משתי חלליות וויאג\'ר ששוגרו ב-1977. הם נושאים צלילים ותמונות שמציגים את החיים והתרבות בכדור הארץ, שנבחרו בידי ועדה בראשות קרל סייגן.');
  TR2('luna9', 'Luna 9 Monument', '#c9a24a', 40, 50, 3400, 'real: first soft landing on the Moon, 1966', 'Luna 9 (USSR) made the first soft landing on the Moon on 3 February 1966, in Oceanus Procellarum. About four minutes after touchdown its four petals opened, and it sent back the first photos ever taken from the surface of another world. The landing capsule weighed 99 kg.', 'לונה 9 (ברית המועצות) ביצעה את הנחיתה הרכה הראשונה על הירח ב-3 בפברואר 1966, באוקיינוס הסערות. כארבע דקות לאחר הנחיתה נפתחו ארבעת עלי הכותרת שלה, והיא שידרה את התמונות הראשונות שצולמו אי פעם מפני השטח של עולם אחר. הקפסולה ששקלה 99 ק"ג.');
  TR2('apollo13', 'Apollo 13 Monument', '#e8e2d2', 60, 60, 3800, 'real: the rescue of Apollo 13, 1970', 'Apollo 13 launched on 11 April 1970 to land on the Moon. Two days later an oxygen tank in the service module exploded. Lovell, Swigert and Haise used the lunar module Aquarius as a lifeboat, and Mission Control in Houston found a way to bring all three home. They splashed down safely in the Pacific on 17 April 1970.', 'אפולו 13 שוגרה ב-11 באפריל 1970 כדי לנחות על הירח. כעבור יומיים התפוצץ מיכל חמצן במודול השירות. לאבל, סוויגרט והייז השתמשו במודול הירח אקווריוס כסירת הצלה, ובקרת המשימה ביוסטון מצאה דרך להחזיר את שלושתם הביתה. הם נחתו בשלום באוקיינוס השקט ב-17 באפריל 1970.');
  TR2('hubble', 'Hubble Telescope Monument', '#9fb0d8', 50, 70, 4200, 'real: Hubble Space Telescope, 1990', 'The Hubble Space Telescope was launched on 24 April 1990 aboard Space Shuttle Discovery (STS-31) into low Earth orbit. Its main mirror is 2.4 m wide. It is still working, and it has taken some of the best-known pictures of the universe.', 'טלסקופ החלל האבל שוגר ב-24 באפריל 1990 על גבי מעבורת החלל דיסקברי (STS-31) למסלול נמוך סביב כדור הארץ. קוטר המראה הראשית שלו 2.4 מטר. הוא עדיין פועל, וצילם כמה מהתמונות המפורסמות ביותר של היקום.');
  TR2('webb', 'James Webb Telescope Monument', '#e9bd45', 50, 80, 4600, 'real: James Webb Space Telescope, 2021', 'The James Webb Space Telescope was launched on 25 December 2021 on an Ariane 5 rocket from French Guiana. It sits near the Sun-Earth L2 point, about 1.5 million km from Earth. Its mirror is 6.5 m wide and made of 18 gold-coated hexagonal segments, and a tennis-court-sized sunshield keeps it cold, because it looks in infrared light.', 'טלסקופ החלל ג\'יימס וב שוגר ב-25 בדצמבר 2021 על גבי טיל אריאן 5 מגיאנה הצרפתית. הוא נמצא ליד נקודת הלגרנז\' L2 של השמש וכדור הארץ, כ-1.5 מיליון ק"מ מכדור הארץ. המראה שלו ברוחב 6.5 מטר ומורכבת מ-18 מקטעים משושים מצופים זהב, ומגן שמש בגודל מגרש טניס שומר עליו קר, כי הוא מביט באור אינפרא-אדום.');
  TR2('copernicus', 'Copernicus Monument', '#c9a06a', 46, 55, 5000, 'real: crater Copernicus on the Moon, 93 km', 'Nicolaus Copernicus (1473-1543) moved the Earth from the center of the universe and placed the Sun there in his book On the Revolutions of the Heavenly Spheres, published in the year of his death. The Moon honors him with Copernicus, a 93 km crater whose bright rays are visible from Earth with binoculars.', 'ניקולאוס קופרניקוס (1473-1543) הזיז את כדור הארץ ממרכז היקום והציב במקומו את השמש, בספרו על סיבובי הגלגלים השמימיים שיצא בשנת מותו. הירח מכבד אותו במכתש קופרניקוס בקוטר 93 קמ, שקרניו הבהירות נראות מכדור הארץ במשקפת.');
  TR2('tycho', 'Tycho Monument', '#d8b46a', 44, 55, 5400, 'real: crater Tycho on the Moon, 85 km', 'Tycho Brahe (1546-1601) measured the positions of stars and planets with huge instruments, years before the telescope, and his precise tables made Kepler\'s laws possible. The Moon honors him with Tycho, an 85 km crater in the southern highlands whose rays cross the whole visible face at full moon.', 'טיכו ברהה (1546-1601) מדד את מקומן של כוכבים וכוכבי לכת במכשירים ענקיים, שנים לפני הטלסקופ, וטבלאותיו המדויקות אפשרו את חוקי קפלר. הירח מכבד אותו במכתש טיכו בקוטר 85 קמ באזור ההררי הדרומי, שקרניו חוצות את כל הפנים הנראות במלא הירח.');
  TR2('kepler', 'Kepler Monument', '#b8c4dc', 42, 55, 5800, 'real: crater Kepler on the Moon, 32 km', 'Johannes Kepler (1571-1630) discovered that planets move in ellipses, not circles, and his three laws of planetary motion still steer every spacecraft today. The Moon honors him with Kepler, a young 32 km crater in Oceanus Procellarum with a fine ray system.', 'יוהאנס קפלר (1571-1630) גילה שכוכבי הלכת נעים באליפסות ולא במעגלים, ושלושת חוקיו על תנועת הכוכבים מנווטים חלליות עד היום. הירח מכבד אותו במכתש קפלר, מכתש צעיר בקוטר 32 קמ באוקיינוס הסערות, עם מערכת קרניים עדינה.');
  TR2('galileo', 'Galileo Monument', '#c9b28a', 46, 60, 6200, 'real: crater Galilaei on the Moon', 'Galileo Galilei (1564-1642) was the first to point a telescope at the night sky: he saw mountains on the Moon and four moons circling Jupiter, and proved that not everything revolves around the Earth. The Moon honors him with the crater Galilaei in western Oceanus Procellarum.', 'גלילאו גליליי (1564-1642) היה הראשון שהפנה טלסקופ לשמי הלילה: הוא ראה הרים על הירח וארבעה ירחים מקיפים את צדק, והוכיח שלא הכל סובב את כדור הארץ. הירח מכבד אותו במכתש גליליי שבמערב אוקיינוס הסערות.');
  TR2('newton', 'Newton Monument', '#a8b89a', 46, 60, 6600, 'real: crater Newton on the Moon, 79 km', 'Isaac Newton (1643-1727) bound the fall of an apple and the orbit of the Moon into one law of universal gravitation, and his Principia made physics a mathematical science. The Moon honors him with Newton, a 79 km crater near the south pole, one of the deepest on the visible face.', 'אייזק ניוטון (1643-1727) קשר את נפילת התפוח ואת מסלול הירח לחוק כבידה אחד, וספרו העקרונות הפך את הפיזיקה למדע מתמטי. הירח מכבד אותו במכתש ניוטון בקוטר 79 קמ ליד הקוטב הדרומי, אחד המכתשים העמוקים בצד הנראה.');
