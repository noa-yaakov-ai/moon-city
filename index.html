function powerPlan() { // plain numbers: how short is the grid at night and the cheapest ways to fix it
  const st = S.stats || {}, dem = st.demand || 0, nuc = st.nucOut || 0, sol = st.solarCap || 0, bc = st.battCap || 0;
  const nightH = CONFIG.daysPerCycle * 24 * (1 - CONFIG.dayFraction), dayH = CONFIG.daysPerCycle * 24 * CONFIG.dayFraction;
  const nightDef = Math.max(0, dem - nuc), dayDef = Math.max(0, dem - nuc - sol * 0.6);
  const needMWh = nightDef * nightH, moreMWh = Math.max(0, needMWh - bc);
  const nBat = Math.ceil(moreMWh / DEFS.battery.storage), costBat = nBat * DEFS.battery.cost;
  const avgSurplus = sol * 0.6 + nuc - dem, needSurplus = needMWh / (dayH + nightH) * 2 * 0.5 + 0; // charge over the day: energy to store / day hours
  const chargeNeed = needMWh / dayH / (CONFIG.chargeBonus || 1), nSol = Math.ceil(Math.max(0, chargeNeed - Math.max(0, sol * 0.8 + nuc - dem)) / (DEFS.solar.power * 0.8)), costSol = nSol * DEFS.solar.cost;
  const nBig = Math.ceil(nightDef / DEFS.nuclear.power), nSmall = Math.ceil(nightDef / DEFS.nuclear2.power);
